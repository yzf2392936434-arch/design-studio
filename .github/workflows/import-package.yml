name: import-package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract package
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o /tmp/pkg.zip "https://aka.doubaocdn.com/s/IwVZVHl2GM"
          unzip -q /tmp/pkg.zip -d /tmp/pkg
          rm -rf design-studio
          cp -r /tmp/pkg/design-studio ./design-studio
          find design-studio -type f | wc -l

      - name: Commit package
        run: |
          set -euo pipefail
          git config user.name "design-studio bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A design-studio
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Import design-studio skill package"
            git push
          fi
